<!DOCTYPE html>
<html lang="en" x-data="app()" :class="{ 'dark': darkMode }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title x-text="t('title')">Ro Dosar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'ro-blue': '#002B7F',
                        'ro-yellow': '#FCD116',
                        'ro-red': '#CE1126',
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }

        .gradient-border {
            background: linear-gradient(90deg, #002B7F 33%, #FCD116 33%, #FCD116 66%, #CE1126 66%);
        }

        .card-hover {
            transition: all 0.3s ease;
        }

        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }

        .pulse-border {
            animation: pulse-border 2s ease-in-out infinite;
        }

        @keyframes pulse-border {
            0%, 100% { border-color: #002B7F; }
            50% { border-color: #FCD116; }
        }

        .slide-up {
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .shimmer {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 dark:from-slate-900 dark:to-slate-800 transition-colors duration-300">
    <!-- Top gradient border (Romanian flag colors) -->
    <div class="gradient-border h-1 w-full fixed top-0 z-50"></div>

    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <!-- Header -->
        <header class="text-center mb-12">
            <!-- Language & Theme Toggle -->
            <div class="flex justify-end gap-2 mb-6">
                <!-- Language Toggle -->
                <div class="inline-flex rounded-lg border border-slate-200 dark:border-slate-700 p-1 bg-white dark:bg-slate-800">
                    <button
                        @click="setLang('ro')"
                        :class="lang === 'ro' ? 'bg-ro-blue text-white' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700'"
                        class="px-3 py-1 rounded-md text-sm font-medium transition-all"
                    >
                        RO
                    </button>
                    <button
                        @click="setLang('en')"
                        :class="lang === 'en' ? 'bg-ro-blue text-white' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700'"
                        class="px-3 py-1 rounded-md text-sm font-medium transition-all"
                    >
                        EN
                    </button>
                </div>

                <!-- Dark Mode Toggle -->
                <button
                    @click="darkMode = !darkMode"
                    class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition-all"
                >
                    <svg x-show="!darkMode" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                    </svg>
                    <svg x-show="darkMode" x-cloak class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
                    </svg>
                </button>
            </div>

            <!-- Romanian Flag -->
            <div class="text-6xl mb-4">🇷🇴</div>

            <!-- Title -->
            <h1 class="text-4xl md:text-5xl font-bold text-ro-blue dark:text-white mb-3">
                RO-DOSAR
            </h1>
            <p class="text-slate-600 dark:text-slate-400 text-lg" x-text="t('subtitle')"></p>
        </header>

        <!-- Search Card -->
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl p-6 md:p-8 mb-8 card-hover">
            <form @submit.prevent="search" class="space-y-6">
                <div>
                    <label for="query" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2" x-text="t('documentNumber')"></label>
                    <div class="relative">
                        <input
                            type="text"
                            id="query"
                            x-model="query"
                            :placeholder="t('placeholder')"
                            class="w-full px-4 py-4 text-lg border-2 border-slate-200 dark:border-slate-600 rounded-xl focus:border-ro-blue dark:focus:border-ro-yellow focus:outline-none transition-colors bg-white dark:bg-slate-700 text-slate-900 dark:text-white placeholder-slate-400"
                            :class="{ 'pulse-border': loading }"
                            autofocus
                        >
                        <div class="absolute right-4 top-1/2 -translate-y-1/2">
                            <svg x-show="!loading" class="w-6 h-6 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                            </svg>
                            <svg x-show="loading" x-cloak class="w-6 h-6 text-ro-blue dark:text-ro-yellow animate-spin" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                        </div>
                    </div>
                    <p class="mt-2 text-sm text-slate-500 dark:text-slate-400" x-text="t('formatHint')"></p>
                </div>

                <button
                    type="submit"
                    :disabled="loading || !query.trim()"
                    class="w-full py-4 px-6 bg-gradient-to-r from-ro-blue to-blue-700 hover:from-blue-700 hover:to-ro-blue text-white font-semibold rounded-xl shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none"
                >
                    <span class="flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                        <span x-text="t('searchButton')"></span>
                    </span>
                </button>
            </form>
        </div>

        <!-- Recent Searches -->
        <div x-show="recent.length > 0" x-cloak class="mb-8">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-sm font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wide" x-text="t('recentSearches')"></h3>
                <button
                    @click="clearRecent()"
                    class="text-sm text-slate-400 hover:text-ro-blue dark:hover:text-ro-yellow underline transition-colors"
                    x-text="t('clearAll')"
                ></button>
            </div>
            <div class="flex flex-wrap gap-2">
                <template x-for="entry in recent" :key="entry.num">
                    <div class="inline-flex items-center gap-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-full pl-3 pr-1 py-1 shadow-sm">
                        <button
                            @click="searchRecent(entry.num)"
                            class="flex items-center gap-1.5 text-sm font-medium text-slate-700 dark:text-slate-200 hover:text-ro-blue dark:hover:text-ro-yellow transition-colors"
                        >
                            <svg x-show="entry.solved" class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                            <span x-text="entry.num"></span>
                        </button>
                        <button
                            @click="removeRecent(entry.num)"
                            class="p-1 text-slate-400 hover:text-red-500 rounded-full transition-colors"
                        >
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                            </svg>
                        </button>
                    </div>
                </template>
            </div>
        </div>

        <!-- Error Message -->
        <div
            x-show="error"
            x-cloak
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 transform -translate-y-2"
            x-transition:enter-end="opacity-100 transform translate-y-0"
            class="mb-8 bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 rounded-xl p-4"
        >
            <div class="flex items-center gap-3">
                <div class="flex-shrink-0">
                    <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>
                <p class="text-red-700 dark:text-red-300" x-text="error"></p>
            </div>
        </div>

        <!-- Loading Skeleton -->
        <div x-show="loading && !document" x-cloak class="space-y-4">
            <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl p-6 md:p-8">
                <div class="shimmer h-8 w-48 rounded mb-6"></div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="shimmer h-20 rounded-xl"></div>
                    <div class="shimmer h-20 rounded-xl"></div>
                    <div class="shimmer h-20 rounded-xl"></div>
                    <div class="shimmer h-20 rounded-xl"></div>
                </div>
            </div>
        </div>

        <!-- Results -->
        <div x-show="document" x-cloak class="slide-up">
            <!-- Document Card -->
            <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl overflow-hidden mb-6">
                <!-- Card Header -->
                <div class="gradient-border h-1"></div>
                <div class="p-6 md:p-8">
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-2xl font-bold text-slate-800 dark:text-white flex items-center gap-3">
                            <svg class="w-7 h-7 text-ro-blue dark:text-ro-yellow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                            </svg>
                            <span x-text="document?.documentNumber"></span>
                        </h2>
                    </div>

                    <!-- Info Grid -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Registration Date -->
                        <div class="bg-slate-50 dark:bg-slate-700/50 rounded-xl p-4 card-hover">
                            <div class="flex items-center gap-3">
                                <div class="p-2 bg-blue-100 dark:bg-blue-900/50 rounded-lg">
                                    <svg class="w-5 h-5 text-blue-600 dark:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                                    </svg>
                                </div>
                                <div>
                                    <p class="text-xs text-slate-500 dark:text-slate-400 uppercase tracking-wide" x-text="t('registrationDate')"></p>
                                    <p class="text-lg font-semibold text-slate-800 dark:text-white" x-text="formatDate(document?.registeredAt)"></p>
                                </div>
                            </div>
                        </div>

                        <!-- Category -->
                        <div
                            class="bg-slate-50 dark:bg-slate-700/50 rounded-xl p-4 card-hover cursor-pointer hover:ring-2 hover:ring-purple-300 dark:hover:ring-purple-600 transition-all"
                            @click="showCategoryModal = true"
                        >
                            <div class="flex items-center gap-3">
                                <div class="p-2 bg-purple-100 dark:bg-purple-900/50 rounded-lg">
                                    <svg class="w-5 h-5 text-purple-600 dark:text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A2 2 0 013 12V7a4 4 0 014-4z"/>
                                    </svg>
                                </div>
                                <div class="flex-1 min-w-0">
                                    <p class="text-xs text-slate-500 dark:text-slate-400 uppercase tracking-wide" x-text="t('category')"></p>
                                    <p class="text-lg font-semibold text-slate-800 dark:text-white flex items-center gap-2">
                                        <span x-text="getCategoryName(document?.category)"></span>
                                        <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                        </svg>
                                    </p>
                                </div>
                            </div>
                        </div>

                        <!-- Term -->
                        <div x-show="document?.term" class="bg-slate-50 dark:bg-slate-700/50 rounded-xl p-4 card-hover">
                            <div class="flex items-center gap-3">
                                <div class="p-2 bg-amber-100 dark:bg-amber-900/50 rounded-lg">
                                    <svg class="w-5 h-5 text-amber-600 dark:text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                    </svg>
                                </div>
                                <div>
                                    <p class="text-xs text-slate-500 dark:text-slate-400 uppercase tracking-wide" x-text="t('term')"></p>
                                    <p class="text-lg font-semibold text-slate-800 dark:text-white" x-text="formatDate(document?.term)"></p>
                                </div>
                            </div>
                        </div>

                        <!-- Solution Number -->
                        <div x-show="document?.solutionNumber" class="bg-slate-50 dark:bg-slate-700/50 rounded-xl p-4 card-hover">
                            <div class="flex items-center gap-3">
                                <div class="p-2 bg-green-100 dark:bg-green-900/50 rounded-lg">
                                    <svg class="w-5 h-5 text-green-600 dark:text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                    </svg>
                                </div>
                                <div>
                                    <p class="text-xs text-slate-500 dark:text-slate-400 uppercase tracking-wide" x-text="t('solutionNumber')"></p>
                                    <p class="text-lg font-semibold text-slate-800 dark:text-white" x-text="document?.solutionNumber"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Appointments -->
            <div x-show="document?.appointments?.length > 0" class="space-y-4">
                <h3 class="text-xl font-bold text-slate-800 dark:text-white flex items-center gap-2">
                    <svg class="w-6 h-6 text-ro-blue dark:text-ro-yellow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>
                    <span x-text="t('appointments')"></span>
                    <span class="ml-2 px-2 py-0.5 bg-slate-200 dark:bg-slate-700 rounded-full text-sm" x-text="document?.appointments?.length"></span>
                </h3>

                <template x-for="(apt, index) in document?.appointments" :key="index">
                    <div class="bg-white dark:bg-slate-800 rounded-xl shadow-lg overflow-hidden card-hover">
                        <div class="border-l-4" :class="getAppointmentBorderClass(apt)">
                            <div class="p-5">
                                <div class="flex flex-wrap items-center justify-between gap-4 mb-3">
                                    <div class="flex items-center gap-3">
                                        <span
                                            class="px-3 py-1 rounded-full text-sm font-medium"
                                            :class="getAppointmentTypeClass(apt)"
                                            x-text="t(apt.type === 'INVITATION' ? 'invitation' : 'result')"
                                        ></span>
                                        <span class="text-slate-600 dark:text-slate-400 flex items-center gap-1">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                                            </svg>
                                            <span x-text="formatDate(apt.date)"></span>
                                        </span>
                                        <span x-show="apt.time" class="text-slate-600 dark:text-slate-400 flex items-center gap-1">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                            </svg>
                                            <span x-text="apt.time"></span>
                                        </span>
                                    </div>
                                </div>

                                <div x-show="apt.result" class="mt-3">
                                    <div
                                        class="inline-flex items-center gap-2 px-4 py-2 rounded-lg"
                                        :class="getResultClass(apt.result)"
                                    >
                                        <template x-if="isPositiveResult(apt.result)">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                            </svg>
                                        </template>
                                        <template x-if="isNegativeResult(apt.result)">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                            </svg>
                                        </template>
                                        <template x-if="!isPositiveResult(apt.result) && !isNegativeResult(apt.result)">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                            </svg>
                                        </template>
                                        <span class="font-medium" x-text="apt.result"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- Processing Statistics -->
        <div x-show="stats && stats.categories.length > 0" x-cloak class="mt-12">
            <h3 class="text-xl font-bold text-slate-800 dark:text-white flex items-center gap-2 mb-4">
                <svg class="w-6 h-6 text-ro-blue dark:text-ro-yellow" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                </svg>
                <span x-text="t('statsTitle')"></span>
            </h3>

            <div class="space-y-4">
                <template x-for="cat in stats.categories" :key="cat.category.code">
                    <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl overflow-hidden">
                        <!-- Card header -->
                        <button @click="toggleCat(cat.category.code)" class="w-full flex items-center justify-between p-5 text-left">
                            <div class="flex items-center gap-3 flex-wrap">
                                <span class="text-lg font-semibold text-slate-800 dark:text-white" x-text="getCategoryName(cat.category)"></span>
                                <span class="text-sm text-slate-500 dark:text-slate-400" x-text="fmtNum(catTotal(cat)) + ' ' + t('dossiers')"></span>
                            </div>
                            <div class="flex items-center gap-3">
                                <span
                                    x-show="frontierYear(cat) !== null"
                                    class="px-2.5 py-0.5 bg-amber-100 dark:bg-amber-900/50 text-amber-700 dark:text-amber-300 rounded-full text-sm font-medium whitespace-nowrap"
                                    x-text="t('now') + ': ' + frontierYear(cat)"
                                ></span>
                                <svg class="w-5 h-5 text-slate-400 transition-transform" :class="{ 'rotate-180': expandedCat === cat.category.code }" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                                </svg>
                            </div>
                        </button>

                        <!-- Card body -->
                        <div x-show="expandedCat === cat.category.code" x-cloak class="px-5 pb-5">
                            <div class="space-y-3">
                                <template x-for="y in cat.years" :key="y.year">
                                    <div
                                        class="rounded-lg p-2 -mx-2"
                                        :class="{
                                            'bg-amber-50 dark:bg-amber-900/20': frontierYear(cat) === y.year,
                                            'ring-2 ring-ro-blue dark:ring-ro-yellow': isYourYear(cat, y)
                                        }"
                                    >
                                        <div class="flex items-center justify-between gap-2 text-sm mb-1">
                                            <span class="font-semibold text-slate-800 dark:text-white">
                                                <span x-text="y.year"></span>

    <script>
        function app() {
            return {
                query: '',
                document: null,
                error: null,
                loading: false,
                showCategoryModal: false,
                showPrivacyModal: false,
                lang: localStorage.getItem('lang') || 'ro',
                darkMode: localStorage.getItem('darkMode') === 'true',
                recent: [],
                stats: null,
                expandedCat: null,

                translations: {
                    en: {
                        title: 'RO-DOSAR - Romanian Citizenship Status',
                        subtitle: 'Check your Romanian citizenship application status',
                        documentNumber: 'Document Number',
                        placeholder: 'e.g., 10435/A/2025',
                        formatHint: 'Format: NUMBER/CATEGORY/YEAR (e.g., 10435/A/2025)',
                        searchButton: 'Search Document',
                        registrationDate: 'Registration Date',
                        category: 'Category',
                        term: 'Term',
                        solutionNumber: 'Solution Number',
                        appointments: 'Appointments',
                        invitation: 'Invitation',
                        result: 'Result',
                        notFound: 'Document not found',
                        invalidFormat: 'Invalid document number format',
                        error: 'An error occurred. Please try again.',
                        footer: 'Data sourced from the Romanian National Citizenship Authority',
                        recentSearches: 'Recent searches',
                        clearAll: 'Clear all',
                        statsTitle: 'Processing Statistics',
                        dossiers: 'dossiers',
                        now: 'now',
                        of: 'of',
                        solvedLabel: 'solved',
                        currentlyHere: 'currently here',
                        yourYear: 'your year',
                        lastNDays: 'Last {n} days',
                        solutions: 'solutions',
                        termChanges: 'term changes'
                    },
                    ro: {
                        title: 'RO-DOSAR - Verificare Cetățenie',
                        subtitle: 'Verificați statusul cererii de cetățenie română',
                        documentNumber: 'Număr Dosar',
                        placeholder: 'ex. 10435/A/2025',
                        formatHint: 'Format: NUMĂR/CATEGORIE/AN (ex. 10435/A/2025)',
                        searchButton: 'Caută Dosar',
                        registrationDate: 'Data Înregistrării',
                        category: 'Categorie',
                        term: 'Termen',
                        solutionNumber: 'Număr Soluție',
                        appointments: 'Programări',
                        invitation: 'Invitație',
                        result: 'Rezultat',
                        notFound: 'Dosarul nu a fost găsit',
                        invalidFormat: 'Format invalid pentru numărul dosarului',
                        error: 'A apărut o eroare. Vă rugăm încercați din nou.',
                        footer: 'Date preluate de la Autoritatea Națională pentru Cetățenie',
                        recentSearches: 'Căutări recente',
                        clearAll: 'Șterge tot',
                        statsTitle: 'Statistica procesării',
                        dossiers: 'dosare',
                        now: 'acum',
                        of: 'din',
                        solvedLabel: 'soluționate',
                        currentlyHere: 'în lucru acum',
                        yourYear: 'anul dvs.',
                        lastNDays: 'Ultimele {n} zile',
                        solutions: 'soluții',
                        termChanges: 'termene modificate'
                    }
                },

                init() {
                    this.loadRecent();
                    this.loadStats();

                    this.$watch('darkMode', (value) => {
                        localStorage.setItem('darkMode', value);
                    });

                    // Check URL for document number
                    const params = new URLSearchParams(window.location.search);
                    const docNum = params.get('doc');
                    if (docNum) {
                        this.query = docNum;
                        this.search();
                    }
                },

                t(key) {
                    return this.translations[this.lang][key] || key;
                },

                setLang(newLang) {
                    this.lang = newLang;
                    localStorage.setItem('lang', newLang);
                    document.documentElement.lang = newLang;
                },

                loadRecent() {
                    try {
                        const parsed = JSON.parse(localStorage.getItem('recentDocs') || '[]');
                        this.recent = Array.isArray(parsed)
                            ? parsed.filter(e => e && typeof e.num === 'string')
                            : [];
                    } catch (err) {
                        this.recent = [];
                        localStorage.removeItem('recentDocs');
                    }
                },

                saveRecent() {
                    localStorage.setItem('recentDocs', JSON.stringify(this.recent));
                },

                addRecent(doc) {
                    const entry = {
                        num: doc.documentNumber,
                        solved: !!doc.solutionNumber,
                        viewedAt: new Date().toISOString()
                    };
                    this.recent = [entry, ...this.recent.filter(e => e.num !== entry.num)].slice(0, 10);
                    this.saveRecent();
                },

                removeRecent(num) {
                    this.recent = this.recent.filter(e => e.num !== num);
                    this.saveRecent();
                },

                clearRecent() {
                    this.recent = [];
                    this.saveRecent();
                },

                searchRecent(num) {
                    this.query = num;
                    this.search();
                },

                async loadStats() {
                    try {
                        const response = await fetch('/api/v1/stats');
                        if (!response.ok) throw new Error('stats request failed: ' + response.status);
                        this.stats = await response.json();
                    } catch (err) {
                        console.error(err);
                        this.stats = null;
                    }
                },

                toggleCat(code) {
                    this.expandedCat = this.expandedCat === code ? null : code;
                },

                catTotal(cat) {
                    return cat.years.reduce((sum, y) => sum + y.total, 0);
                },

                pct(y) {
                    return y.total > 0 ? Math.round((y.solved / y.total) * 100) : 0;
                },

                fmtNum(n) {
                    return n.toLocaleString(this.lang === 'ro' ? 'ro-RO' : 'en-GB');
                },

                // Frontier: among years with recent solved > 0 pick max count
                // (years ascending, strict > keeps the earliest on ties);
                // fallback: earliest year with solved share in [5%, 95%)
                frontierYear(cat) {
                    const active = (cat.recentActivity || []).filter(a => a.solved > 0);
                    if (active.length > 0) {
                        let best = active[0];
                        for (const a of active) {
                            if (a.solved > best.solved) best = a;
                        }
                        return best.year;
                    }
                    for (const y of cat.years) {
                        const share = y.total > 0 ? y.solved / y.total : 0;
                        if (share >= 0.05 && share < 0.95) return y.year;
                    }
                    return null;
                },

                docYear() {
                    if (!this.document?.registeredAt) return null;
                    return new Date(this.document.registeredAt).getFullYear();
                },

                isYourYear(cat, y) {
                    return this.document?.category?.code === cat.category.code
                        && this.docYear() === y.year;
                },

                formatDate(dateStr) {
                    if (!dateStr) return '';
                    const date = new Date(dateStr);
                    return date.toLocaleDateString(this.lang === 'ro' ? 'ro-RO' : 'en-GB', {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric'
                    });
                },

                getCategoryName(category) {
                    if (!category) return '';
                    // If category is an object with name/nameRO fields
                    if (typeof category === 'object') {
                        return this.lang === 'ro' ? category.nameRO : category.name;
                    }
                    // Fallback for string category
                    return category;
                },

                async search() {
                    if (!this.query.trim()) return;

                    this.loading = true;
                    this.error = null;
                    this.document = null;
                    this.expandedCat = null;

                    try {
                        // Parse document number
                        const match = this.query.trim().match(/^(\d+)\s*[\/\\]\s*([A-Za-z]+)\s*[\/\\]\s*(\d{4})$/);
                        if (!match) {
                            this.error = this.t('invalidFormat');
                            return;
                        }

                        const [, number, category, year] = match;
                        const response = await fetch(`/api/v1/documents/${number}/${category.toUpperCase()}/${year}`);

                        if (response.status === 404) {
                            this.error = this.t('notFound');
                            return;
                        }

                        if (!response.ok) {
                            const data = await response.json();
                            this.error = data.detail || this.t('error');
                            return;
                        }

                        this.document = await response.json();
                        this.addRecent(this.document);
                        this.expandedCat = this.document.category.code;

                        // Update URL
                        const url = new URL(window.location);
                        url.searchParams.set('doc', this.query.trim());
                        window.history.pushState({}, '', url);

                    } catch (err) {
                        console.error(err);
                        this.error = this.t('error');
                    } finally {
                        this.loading = false;
                    }
                },

                getAppointmentTypeClass(apt) {
                    if (apt.type === 'INVITATION') {
                        return 'bg-blue-100 dark:bg-blue-900/50 text-blue-700 dark:text-blue-300';
                    }
                    return 'bg-purple-100 dark:bg-purple-900/50 text-purple-700 dark:text-purple-300';
                },

                getAppointmentBorderClass(apt) {
                    if (apt.result) {
                        if (this.isPositiveResult(apt.result)) return 'border-green-500';
                        if (this.isNegativeResult(apt.result)) return 'border-red-500';
                        return 'border-amber-500';
                    }
                    return apt.type === 'INVITATION' ? 'border-blue-500' : 'border-purple-500';
                },

                getResultClass(result) {
                    if (this.isPositiveResult(result)) {
                        return 'bg-green-100 dark:bg-green-900/50 text-green-700 dark:text-green-300';
                    }
                    if (this.isNegativeResult(result)) {
                        return 'bg-red-100 dark:bg-red-900/50 text-red-700 dark:text-red-300';
                    }
                    return 'bg-amber-100 dark:bg-amber-900/50 text-amber-700 dark:text-amber-300';
                },

                isPositiveResult(result) {
                    if (!result) return false;
                    const lower = result.toLowerCase();
                    return lower.includes('pozitiv') || lower.includes('admis');
                },

                isNegativeResult(result) {
                    if (!result) return false;
                    const lower = result.toLowerCase();
                    return lower.includes('negativ') || lower.includes('respins') || lower.includes('absent');
                },

                formatLegalText(text) {
                    if (!text) return '';

                    // Escape HTML
                    let formatted = text
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;');

                    // Format paragraph numbers like (1), (2), (3) at start of lines
                    formatted = formatted.replace(/^(\(\d+\))/gm,
                        '<span class="font-bold text-ro-blue dark:text-ro-yellow">$1</span>');

                    // Format letter items like a), b), c) at start of lines
                    formatted = formatted.replace(/^([a-z]\))/gm,
                        '<span class="font-semibold text-purple-600 dark:text-purple-400 ml-4">$1</span>');

                    // Convert newlines to <br> for proper line breaks
                    formatted = formatted.replace(/\n\n/g, '</p><p class="mt-3">');
                    formatted = formatted.replace(/\n/g, '<br>');

                    return '<p>' + formatted + '</p>';
                }
            }
        }
    </script>
</body>
</html>
